[project]
name = "big-brother-vision"
version = "0.2.0"
description = "Virtual surveillance camera with fighter-jet HUD and real-time emotion metrics"
authors = [
    {name = "qnelo"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mediapipe>=0.10.0",
    "opencv-python>=4.11.0",
    "pyvirtualcam>=0.11.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
]

[project.scripts]
big-brother-vision = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = [
    "main.py",
    "vision_pipeline.py",
    "emotion_mapper.py",
    "face_tracker.py",
    "hud_renderer.py",
    "cat_detector.py",
    "cat_emotion_mapper.py",
]

[tool.ruff]
line-length = 79
target-version = "py310"
src = ["."]
exclude = [".git", "__pycache__", "*.egg-info", ".venv", "venv"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
]
ignore = [
    "B008",
    "B904",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
