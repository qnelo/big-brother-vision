[project]
name = "laughing-man-cam"
version = "0.1.0"
description = "Virtual camera filter that overlays the iconic 'Laughing Man' logo on your face in real-time for Google Meet"
authors = [
    {name = "qnelo"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mediapipe>=0.10.0",
    "opencv-python>=4.11.0",
    "pyvirtualcam>=0.11.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
]

[project.scripts]
laughing-man = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["main.py", "face_overlay.py"]

# -----------------------------------------------------------------------------
# Ruff: linter + formatter (PEP 8 style guide)
# https://docs.astral.sh/ruff/configuration/
# -----------------------------------------------------------------------------
[tool.ruff]
line-length = 79
target-version = "py310"
src = ["."]
exclude = [".git", "__pycache__", "*.egg-info", ".venv", "venv"]

[tool.ruff.lint]
# Rule sets (PEP 8 and best practices):
#   E, W   - pycodestyle (PEP 8: errors + warnings)
#   F      - Pyflakes (undefined names, unused imports)
#   I      - isort (import sorting)
#   N      - pep8-naming (naming conventions)
#   UP     - pyupgrade (modern Python syntax)
#   B      - flake8-bugbear (common bugs)
#   C4     - flake8-comprehensions (simplify comprehensions)
#   SIM    - flake8-simplify (simplify code)
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # bugbear
    "C4",  # comprehensions
    "SIM", # simplify
]
ignore = [
    "B008",   # do not perform function calls in argument defaults
    "B904",   # raise without from inside except
]

[tool.ruff.lint.per-file-ignores]
# Tests and examples can be more permissive
"tests/*" = ["S101"]  # allow assert

[tool.ruff.format]
# Format on save will use these (PEP 8–aligned style)
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
