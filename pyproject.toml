[project]
name = "laughing-man-cam"
version = "0.1.0"
description = "Virtual camera filter that overlays the iconic 'Laughing Man' logo on your face in real-time for Google Meet"
authors = [
    {name = "qnelo"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mediapipe>=0.10.0",
    "opencv-python>=4.8.0",
    "pyvirtualcam>=0.11.0",
    "numpy>=1.24.0",
]

[project.scripts]
laughing-man = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["main.py", "face_overlay.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "W"]
ignore = []
